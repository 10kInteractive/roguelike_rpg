<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype one</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }
      a {
        color: #9cf;
      }
      #stage {
        position: relative;
        height: 70vh;
        background: #1d3a2a;
      }
      #view,
      #overlay {
        position: absolute;
        inset: 0;
      }
      #view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        pointer-events: none;
      }
      .hud {
        margin: 12px;
      }
      .hud p {
        margin: 0;
      }
      .hud-progress {
        width: 240px;
        margin-top: 6px;
      }
      .hud-stats {
        display: inline-block;
        margin: 8px 0 0;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.75);
        font: 16px/1.4 ui-monospace, monospace;
      }
      .command-window {
        position: absolute;
        right: 12px;
        bottom: 12px;
        min-width: 140px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.75);
        font: 16px/1.6 ui-monospace, monospace;
      }
      .command-row.selected {
        background: #eee;
        color: #111;
      }
      .command-row.unavailable {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <p><a href="../../index.html">Launcher</a></p>
    <div id="stage">
      <div id="view"></div>
      <div id="overlay"></div>
    </div>
    <p>Base path: %BASE_URL%</p>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
